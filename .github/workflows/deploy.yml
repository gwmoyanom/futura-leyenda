# .github/workflows/deploy.yml
#
# Automatically builds and deploys to GitHub Pages
# whenever you push to the `main` branch.
#
# Setup steps (one-time):
# 1. Go to your repo → Settings → Pages
# 2. Set Source to "GitHub Actions"
# 3. Push to main — this workflow does the rest

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # Allow manual trigger from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Set this to your GitHub repository name
          # e.g. if your repo is github.com/yourname/futura-leyenda
          VITE_BASE_PATH: /futura-leyenda/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_SEARCH_API_KEY: ${{ vars.VITE_GOOGLE_SEARCH_API_KEY }}
          VITE_GOOGLE_SEARCH_CX: ${{ vars.VITE_GOOGLE_SEARCH_CX }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
